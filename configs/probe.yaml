# Probe Training Config
# Optimized for training linear classifier on frozen embeddings
lle:
  in_channels: 8
  cnn_filters: [32, 64, 128]
  gru_hidden: 256
  gru_layers: 2
  embedding_dim: 128
  window_size: 50
  se_reduction: 8
hla:
  hidden_dim: 128
  num_layers: 2
  num_classes: 7
  seq_len: 30
  nhead: 4
  dropout: 0.15
  type: transformer
lla:
  num_classes: 4
training:
  batch_size: 256
  lr: 1.0e-3  # Higher LR for probe (10x backbone)
  epochs: 30  # Fewer epochs needed
  patience: 10
  alpha: 1.0
  beta: 0.3
  weight_decay: 1.0e-4  # Stronger regularization
  grad_clip: 1.0
  warmup_epochs: 2
  label_smoothing: 0.0  # Disable for probe
  use_action_class_weights: true
  use_focal_loss: true
data:
  action_label_pad: 0.5
  per_video_center: true
  add_norm_features: true
  augmentation: false  # Disable augmentation for probe
  excluded_scenarios:
    - Gardening
