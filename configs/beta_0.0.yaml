# Final Training Config: Scenario-Only (Phase 1)
# Train backbone with scenario labels only, then probe for action
lle:
  in_channels: 8  # 6 raw + 2 norms (proven config)
  cnn_filters: [32, 64, 128]
  gru_hidden: 256
  gru_layers: 2
  embedding_dim: 128
  window_size: 50
  se_reduction: 8
hla:
  hidden_dim: 128
  num_layers: 2
  num_classes: 7
  seq_len: 30
  nhead: 4
  dropout: 0.15
  type: transformer
lla:
  num_classes: 4
training:
  batch_size: 256
  lr: 1.0e-4
  epochs: 60
  patience: 20
  alpha: 1.0
  beta: 0.0  # Scenario-only for backbone training
  weight_decay: 1.0e-5
  grad_clip: 1.0
  warmup_epochs: 5
  label_smoothing: 0.1
  use_action_class_weights: true
  use_focal_loss: true  # Use Focal Loss for action classification
data:
  action_label_pad: 0.5
  per_video_center: true
  add_norm_features: true
  augmentation: true  # Enable data augmentation
  excluded_scenarios:
    - Gardening
