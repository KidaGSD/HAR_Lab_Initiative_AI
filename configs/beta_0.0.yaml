# Baseline: Scenario-only training (beta=0)
lle:
  in_channels: 8
  cnn_filters: [32, 64, 128]
  gru_hidden: 256
  gru_layers: 2
  embedding_dim: 128
  window_size: 50
  se_reduction: 8
hla:
  hidden_dim: 128
  num_layers: 2
  num_classes: 7  # 8 - 1 (Gardening excluded)
  seq_len: 30
  nhead: 4
  dropout: 0.1
  type: transformer
lla:
  num_classes: 4  # 4-class motion-based action
training:
  batch_size: 256
  lr: 1.0e-4
  epochs: 50
  patience: 15
  alpha: 1.0
  beta: 0.0       # Scenario-only (no action loss)
  weight_decay: 1.0e-5
  grad_clip: 1.0
  warmup_epochs: 5
  use_action_class_weights: false
data:
  action_label_pad: 0.5
  per_video_center: true
  add_norm_features: true
  excluded_scenarios:
    - Gardening
