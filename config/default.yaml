# Default configuration for Layer-1 pipeline assets.
cache:
  raw_root: data/raw/egoexo_cache
  test_root: data/raw/egoexo_cache_test
downloads:
  output_root: data/raw/egoexo_cache
  log_dir: state/active/logs
alignment:
  qa_root: processed_windows/qa
  ready_file: state/active/ready_for_windowing.txt
windowing:
  window_sec: 3.0
  hop_sec: 0.2
  seq_len: 50
  output_root: aligned_windows
  imu_target_hz: 25.0
  gaze_target_hz: 30.0
weak_labels:
  rule_set: linear_angspeed_gazestd_v1
  output_path: weak_labels.parquet
outputs:
  runs_root: runs
  latest_symlink: outputs/latest
  legacy_root: outputs/legacy_run
state:
  active_dir: state/active
